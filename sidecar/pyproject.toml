[project]
name = "pics-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "torch>=2.0",
  "transformers>=5",
  "pillow>=10",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "insightface>=0.7.3",
  "reverse-geocoder>=1.5.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sidecar*"]
